<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cutting Tools · GTC Review Course v0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--ground:#171d20;--gunmetal:#2C3539;--panel:#222a2e;--line:#3a454a;--text:#ebe6dc;--muted:#a3adb1;--amber:#d29a2e;--amber-deep:#8C5A0A;--amber-tint:rgba(210,154,46,.14);--good:#4fb37a;--good-tint:rgba(79,179,122,.14);--bad:#e0594a;--bad-tint:rgba(224,89,74,.14);
--f-display:Georgia,"Times New Roman",serif;--f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--text)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}
svg{display:block}
/* header */
.top{position:sticky;top:0;z-index:20;background:var(--gunmetal);border-bottom:2px solid var(--amber-deep)}
.top-inner{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.wm{display:flex;flex-direction:column;line-height:1;border-left:3px solid var(--amber);padding-left:8px}
.wm b{font-family:var(--f-display);font-size:19px;letter-spacing:.06em}
.wm span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.16em;color:var(--muted)}
.brand .mod{font-family:var(--f-display);font-size:17px;white-space:nowrap}
.brand .hcode{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.track{flex:1;display:flex;gap:4px;min-width:200px;align-items:center}
.track button{flex:1;height:5px;border-radius:3px;background:var(--line);border:0;padding:0;cursor:default}
.track button.done{background:var(--amber-deep)}
.track button.now{background:var(--amber)}
body.revmode .track button{cursor:pointer}
.track-label{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}
.rev-toggle{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px;color:var(--muted)}
.rev-toggle .pip{width:28px;height:16px;border-radius:8px;background:var(--line);position:relative;transition:background .2s}
.rev-toggle .pip::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--text);transition:transform .2s}
.rev-toggle[aria-pressed="true"]{color:var(--text);border-color:var(--amber)}
.rev-toggle[aria-pressed="true"] .pip{background:var(--amber-deep)}
.rev-toggle[aria-pressed="true"] .pip::after{transform:translateX(12px)}
/* stage */
main{max-width:1320px;margin:0 auto;padding:22px 16px 48px}
.screen{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.screen.split{grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);align-items:start}}
.mediacol{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side h2{font-size:clamp(24px,2.6vw,32px);line-height:1.15}
.onscreen{font-size:16px;display:flex;flex-direction:column;gap:10px}
.onscreen strong{color:var(--amber);font-weight:600}
.onscreen ul{margin:0;padding-left:20px;display:grid;gap:7px}
.narr{border-left:2px solid var(--line);padding-left:12px;color:var(--muted);font-style:italic;font-size:14px}
.narr b{font-style:normal;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:block;opacity:.8;margin-bottom:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--amber);background:var(--amber);color:#1b1407;font-weight:600;padding:10px 18px;border-radius:6px;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--amber)}
.hint{font-size:13px;color:var(--muted)}
.media{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.media svg{width:100%;height:auto}
.cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.fadein{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hs{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,4.2vw,46px);aspect-ratio:1;border-radius:50%;border:2px solid #fff;background:rgba(210,154,46,.9);cursor:pointer;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:clamp(12px,1.4vw,16px);color:#1b1407;animation:pulse 2s infinite;padding:0}
.hs.seen{background:rgba(79,179,122,.95);animation:none;color:#08180f}
.hs.act{outline:3px solid #fff;outline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(210,154,46,.7)}70%{box-shadow:0 0 0 14px rgba(210,154,46,0)}100%{box-shadow:0 0 0 0 rgba(210,154,46,0)}}
.alert{border:1px solid var(--bad);background:var(--bad-tint);border-radius:8px;padding:12px 14px}
.okbox{border:1px solid var(--good);background:var(--good-tint);border-radius:8px;padding:12px 14px}
.warnbox{border:1px solid var(--amber);background:var(--amber-tint);border-radius:8px;padding:12px 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:19px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;width:100%}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--amber);flex:none}
.opt.bad{border-color:var(--bad);background:var(--bad-tint)}
.opt.good{border-color:var(--good);background:var(--good-tint)}
.opt:disabled{cursor:default}
.fb{font-size:14px;min-height:1px}
.fb.bad{color:#f08a7e}.fb.good{color:var(--good)}
.steps-lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
/* cover */
.cover{position:relative;border-radius:12px;overflow:hidden;min-height:min(600px,76vh);display:flex;align-items:flex-end;background:var(--gunmetal)}
.cover .bg{position:absolute;inset:0;opacity:.42}
.cover .bg svg{width:100%;height:100%}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,29,32,.15) 0%,rgba(23,29,32,.5) 40%,rgba(23,29,32,.96) 100%)}
.cover-inner{position:relative;z-index:1;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:16px;max-width:820px}
.cover h1{font-size:clamp(46px,8vw,92px);line-height:.95}
.cover .h1sub{font-family:var(--f-display);font-size:clamp(22px,3vw,34px);color:var(--amber);margin-top:-6px}
.cover .sub{font-size:clamp(16px,1.8vw,19px);color:#d4cfc5;max-width:56ch}
.cover .logos{position:absolute;z-index:1;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px clamp(20px,4vw,48px);flex-wrap:wrap}
.rc{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(23,29,32,.7)}
.meta{display:flex;flex-wrap:wrap;gap:14px 28px;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}
.meta div{display:flex;flex-direction:column}
.meta b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--amber);font-weight:500;text-transform:uppercase}
.meta span{font-size:14px}
.objs{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.objs li{display:flex;gap:12px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.objs li b{font-family:var(--f-display);color:var(--amber);font-size:16px;flex:none;width:26px}
/* cone legend + sort */
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.legend .lc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 4px}
.legend .lc b{font-family:var(--f-mono);letter-spacing:.12em;font-size:13px}
.legend .lc span{font-size:13.5px;font-weight:600}
.legend .lc small{font-size:12.5px;color:var(--muted);line-height:1.35}
@media (max-width:640px){.legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
.sortbox{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.tray{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:8px;min-height:104px;align-items:center}
.tray:empty::after{content:"All five cones placed";font-family:var(--f-mono);font-size:12px;color:var(--good);letter-spacing:.1em;text-transform:uppercase}
.dcone{background:none;border:2px solid transparent;border-radius:8px;padding:4px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dcone:hover{border-color:var(--line)}
.dcone.sel{border-color:var(--amber);background:var(--amber-tint)}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.02);border:1px dashed var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:left;width:100%;min-height:78px}
.slot:hover{border-color:var(--amber)}
.slot .drop{width:56px;height:66px;flex:none;border-radius:6px;background:rgba(255,255,255,.04);display:grid;place-items:center}
.slot .stx b{display:block;font-size:15px}
.slot .stx small{color:var(--muted);font-size:13px}
.slot.ok{border-style:solid;border-color:var(--good);background:var(--good-tint);cursor:default}
.slot.no{animation:shake .35s;border-color:var(--bad)}
.slot.hot{border-color:var(--amber);border-style:solid;background:var(--amber-tint)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#ghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-50%);display:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
/* sequence */
.seq{display:grid;gap:8px}
.seqslot{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;min-height:46px;background:rgba(255,255,255,.02);cursor:pointer;width:100%;text-align:left}
.seqslot i{font-style:normal;font-family:var(--f-display);font-size:20px;color:var(--amber);width:18px}
.seqslot.filled{border-style:solid;background:var(--panel)}
.seqslot.right{border-color:var(--good);background:var(--good-tint)}
.seqslot.wrong{border-color:var(--bad);background:var(--bad-tint)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.pool button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.pool button:hover{border-color:var(--amber)}
/* figures */
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fig svg{width:100%;height:auto;border-radius:6px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.asset{border:2px dashed var(--amber-deep);border-radius:10px;background:repeating-linear-gradient(135deg,rgba(140,90,10,.09) 0 12px,transparent 12px 24px);padding:18px;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:190px}
.asset .tagl{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase}
.asset h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:18px}
.asset p{font-size:13.5px;color:var(--muted)}
.mock-btn{align-self:flex-start;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:5px 10px;background:#0f1416;color:var(--muted)}
.code{font-family:var(--f-mono);font-size:12.5px;background:#0f1416;border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:#b9c7cc;overflow-x:auto;white-space:pre;line-height:1.6;margin:0}
.code .hl{color:#1b1407;background:var(--amber);padding:1px 3px;border-radius:2px;font-weight:600}
.code .c{color:#6f7d83}
/* id tags */
.router{font-family:var(--f-mono);font-size:13px;background:#fbfaf6;color:#1d1d1d;border-radius:8px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px}
.router b{color:#8C5A0A}
.idtags{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tagbtn{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.tagbtn:hover:not(:disabled){border-color:var(--amber)}
.tagbtn svg{width:100%;height:auto;max-width:300px;margin:0 auto}
.tagbtn .tl{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.tagbtn.good{border-color:var(--good);background:var(--good-tint)}
.tagbtn.bad{border-color:var(--bad);background:var(--bad-tint)}
.tagbtn:disabled{cursor:default}
/* traveler hotspots */
.trav .tz{cursor:pointer;transition:fill-opacity .15s}
.trav .tz:hover,.trav .tz:focus{fill-opacity:.14;outline:none}
.trav .tz.miss{fill:#e0594a;fill-opacity:.18}
.trav.found .tfound{opacity:1}
.trav.found .tz{pointer-events:none}
/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiers{grid-template-columns:1fr}}
.tier{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--amber);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tier h3{font-size:22px;display:flex;justify-content:space-between;align-items:baseline}
.tier h3 small{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tier .r{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tier .r svg{flex:none;margin-top:1px}
.tier.t1{border-top-color:#e0594a}.tier.t2{border-top-color:var(--amber)}.tier.t3{border-top-color:var(--good)}
.stl{display:grid;gap:8px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.st .bt{display:flex;gap:6px}
.st .bt button{flex:1;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:6px;cursor:pointer;font-family:var(--f-display);font-size:16px}
.st .bt button:hover:not(:disabled){border-color:var(--amber)}
.st .bt button.bad{border-color:var(--bad);background:var(--bad-tint)}
.st .bt button.good{border-color:var(--good);background:var(--good-tint)}
.st.ok{border-color:var(--good)}
.locked{opacity:.45;pointer-events:none}
/* kc */
.kc{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.qdots{display:flex;gap:8px}
.qdots span{width:30px;height:6px;border-radius:3px;background:var(--line)}
.qdots span.now{background:var(--amber)}.qdots span.ok{background:var(--good)}.qdots span.shown{background:var(--amber-deep)}
.prompt-band{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.prompt-band h2{font-size:clamp(21px,2.3vw,28px);line-height:1.25}
/* debrief */
.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.recap div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.recap b{font-family:var(--f-display);font-size:34px;color:var(--amber);font-weight:400;line-height:1}
.recap span{font-family:var(--f-display);font-size:17px}
.pd{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px}
.tries{width:100%;border-collapse:collapse;font-size:14px}
.tries td{padding:6px 0;border-bottom:1px solid var(--line)}
.tries td:last-child{text-align:right;font-family:var(--f-mono)}
.first{color:var(--good)}.more{color:var(--amber)}
/* nav */
.navbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
.navbar .r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* reviewer notes */
.rev{margin-top:26px;border:1px dashed var(--amber-deep);border-radius:10px;padding:16px 18px;background:rgba(140,90,10,.07);display:grid;gap:14px}
.rev-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rev-head h3{font-size:18px;color:var(--amber)}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rev-grid div,.rev-long div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rev b.k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-weight:500;text-transform:uppercase}
.rev span{font-size:14px}
.rev .id{font-family:var(--f-mono);color:var(--amber)}
.rev-long{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.flags{display:grid;gap:8px}
.flag{border-left:3px solid var(--bad);background:var(--bad-tint);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.flag.med{border-left-color:var(--amber);background:var(--amber-tint)}
.flag.low{border-left-color:#7d8b91;background:rgba(125,139,145,.12)}
.flag.bld{border-left-color:#6fa8d6;background:rgba(111,168,214,.1)}
.flag b{display:block;margin-bottom:2px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.flag.high b{color:#f08a7e}.flag.med b{color:var(--amber)}.flag.low b{color:#b7c2c6}.flag.bld b{color:#8fc0e6}
.assets{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14px}
.assets li{display:flex;gap:8px;align-items:baseline}
.pill{font-family:var(--f-mono);font-size:10.5px;font-weight:600;border-radius:4px;padding:2px 7px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;flex:none}
.p-built{background:var(--good-tint);color:var(--good)}
.p-stand{background:var(--amber-tint);color:var(--amber)}
.p-need{background:var(--bad-tint);color:#f08a7e}
.jump{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.jump select{background:var(--ground);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
@media (max-width:640px){.cover{flex-direction:column;align-items:stretch;justify-content:space-between}.cover .logos{position:relative}
.trav,.abw{overflow-x:auto;-webkit-overflow-scrolling:touch}.trav svg{min-width:760px}.abw svg{min-width:700px}.scrollhint{display:block!important}}
.scrollhint{display:none;font-size:12px;color:var(--muted)}
.legendflags{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tbc{color:var(--amber);font-style:normal;background:var(--amber-tint);border-radius:3px;padding:0 4px}
.good{color:var(--good)}.bad{color:#f08a7e}
.btn.sm{padding:6px 12px;font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:14px}
.seg button:hover:not(:disabled){border-color:var(--amber)}
.seg button.good{border-color:var(--good);background:var(--good-tint);color:var(--text)}.seg button.bad{border-color:var(--bad);background:var(--bad-tint);color:var(--text)}
.seg button:disabled{cursor:default}
.lrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:6px 0}
.lrow>b{min-width:70px;font-family:var(--f-mono)}
.why{color:var(--muted);font-size:13px;margin:0}
.locked{opacity:.4;pointer-events:none}
.media .dz{position:absolute;transform:translate(-50%,-50%);min-width:44px;height:34px;padding:0 10px;border-radius:17px;border:2px dashed #fff;background:rgba(210,154,46,.85);color:#1b1407;font-weight:700;font-size:13px;cursor:pointer;animation:pulse 2s infinite}
.media .dz.ok{border-style:solid;background:rgba(79,179,122,.95);color:#08180f;animation:none}
.media .dz.no{animation:shake .35s;background:rgba(224,89,74,.9)}
.dchip{background:var(--amber);color:#1b1407;border:0;border-radius:999px;padding:8px 16px;font-weight:600;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px}
.dchip.sel{outline:3px solid #fff;outline-offset:2px}
.ghostchip{display:inline-block}
.tray{min-height:56px}
.sorts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.sorts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sortc{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sortc svg{height:96px;width:auto}
.sortc.okc{border-color:var(--good)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match button{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;font-size:14px;min-height:52px;display:flex;align-items:center;gap:10px}
.match button:hover:not(:disabled){border-color:var(--amber)}
.match button.sel{border-color:var(--amber);background:var(--amber-tint)}
.match button.ok{border-color:var(--good);background:var(--good-tint)}
.match button.no{border-color:var(--bad);animation:shake .35s}
.match button small{color:var(--muted)}
.mcut svg{height:52px;width:auto;flex:none}
.lineup{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
@media (max-width:640px){.lineup{grid-template-columns:repeat(4,minmax(0,1fr))}}
.lineup div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;text-align:center}
.lineup svg{height:110px;width:auto}
.ttools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ttools{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ttools .tt{background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-align:center}
.ttools .tt svg{width:100%;height:auto}
.ttools .tt.sel{border-color:var(--amber);background:var(--amber-tint)}.ttools .tt.ok{border-color:var(--good);background:var(--good-tint)}
.ttools .tt:hover:not(:disabled){border-color:var(--amber)}
.feats{margin-top:4px}
.parting{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.toollist{background:#fbfaf6;color:#1d1d1d;border-radius:8px;padding:10px 14px;font-family:var(--f-mono);font-size:13px}
.tlh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:4px}
.tlh b{color:#8C5A0A}.tlh span{color:#555;font-size:11.5px}
.toollist table{width:100%;border-collapse:collapse}.toollist td{padding:4px 6px;border-bottom:1px solid #e3e0d8}.toollist td:first-child{font-weight:600;width:36px}.toollist td:last-child{color:#555;white-space:nowrap}
.ctools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.ctools{grid-template-columns:1fr 1fr}}
.ctool{border:2px solid transparent;border-radius:10px;display:flex;flex-direction:column;gap:6px}
.ctool svg{width:100%;height:auto}
.ctool.okc{border-color:var(--good)}
.cz{cursor:pointer;transition:fill-opacity .15s}
.cz:hover,.cz:focus{fill-opacity:.18;outline:none}
.cz.miss{fill:#e0594a;fill-opacity:.25}
.clickmap svg{width:100%;height:auto}
.retl{margin:0;padding-left:22px;display:grid;gap:6px;font-size:14.5px}
.retl li.okc{color:var(--good)}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.chips{grid-template-columns:1fr 1fr}}
.chipb{background:var(--ground);border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:13px;text-align:center}
.chipb svg{width:100%;height:auto}
.chipb.good{border-color:var(--good)}.chipb.bad{border-color:var(--bad)}
.chipb:hover:not(:disabled){border-color:var(--amber)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.fig svg{width:100%;height:auto}
.cap{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.cards4{grid-template-columns:1fr}}
.cards4 .panel h3{font-size:17px}
.onscreen ol{margin:0;padding-left:20px;display:grid;gap:6px}
@media (max-width:640px){.top{position:static}}
.cover .bg svg{width:100%;height:100%}
</style></head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand"><div class="wm"><b>GTC</b><span>GENERAL TOOL COMPANY</span></div><div><div class="mod">Cutting Tools</div><div class="hcode" id="hcode">L1 · STEP A · KNOW, CHECK, CARE</div></div></div>
  <nav class="track" id="track" aria-label="Course progress"></nav>
  <span class="track-label" id="tlabel"></span>
  <button class="rev-toggle" id="revt" aria-pressed="false"><span class="pip"></span>Reviewer notes</button>
</div></header>
<main id="app"></main>
<div id="ghost" aria-hidden="true"></div>
<script>
/* ===== GRAPHICS: all vector, built for this course. TRAINING SAMPLE data only. ===== */
const CONES={
  white:{name:'White',fill:'#efefea',edge:'#aab2b6',band:'#9ea8ad',status:'Incoming inspection',detail:'Ready for inspection',wait:'Incoming inspection. It is ready to be inspected',label:'Incoming inspection'},
  green:{name:'Green',fill:'#37a35f',edge:'#23764a',band:'#eef1ee',status:'Conforms',detail:'Inspection complete; the part conforms',wait:'Nothing. Inspection is complete and it conforms',label:'Conforms'},
  yellow:{name:'Yellow',fill:'#f0c02c',edge:'#b88f12',band:'#fbf6e4',status:'Hold',detail:'More information or input is needed',wait:'More information or input. It is on hold',label:'Hold: needs info'},
  red:{name:'Red',fill:'#d63f2e',edge:'#9a2a1e',band:'#f6eeec',status:'Non-conforming',detail:'Does not meet the requirement or specification',wait:'A decision from Quality. It does not conform',label:'Non-conforming'},
  blue:{name:'Blue',fill:'#2f6fd0',edge:'#1f4e97',band:'#edf2fa',status:'Move order',detail:'A move request has been sent in Egennix; waiting for transfer',wait:'Transfer. A move request is in Egennix',label:'Move order'}
};
const ORDER=['white','green','yellow','red','blue'];
const HAND="'Segoe Print','Bradley Hand','Comic Sans MS',cursive";
const MONO="'IBM Plex Mono',ui-monospace,Menlo,monospace";
const SANS="'IBM Plex Sans','Segoe UI',system-ui,sans-serif";

function coneG(c,x,baseY,s=1){const k=CONES[c];return `<g transform="translate(${x-30*s},${baseY-76*s}) scale(${s})">
<ellipse cx="30" cy="77" rx="30" ry="3.5" fill="#000" opacity=".28"/>
<rect x="3" y="66" width="54" height="10" rx="2" fill="#262b2e"/>
<path d="M24 4 H36 L50 68 H10 Z" fill="${k.fill}" stroke="${k.edge}" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M18.3 30 H41.7 L43.9 40 H16.1 Z" fill="${k.band}"/>
<path d="M14.4 48 H45.6 L47.2 55 H12.8 Z" fill="${k.band}"/>
<path d="M25.5 7 L18 62" stroke="#fff" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
<rect x="22" y="2" width="16" height="4" rx="2" fill="${k.edge}"/></g>`}
function coneSVG(c,w=56){return `<svg viewBox="0 0 60 82" width="${w}" role="img" aria-label="${CONES[c].name} cone">${coneG(c,30,79,1)}</svg>`}

function shopBg(u){return `<defs>
<linearGradient id="${u}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d363b"/><stop offset="1" stop-color="#20282c"/></linearGradient>
<linearGradient id="${u}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#424c50"/><stop offset="1" stop-color="#2d3539"/></linearGradient>
<linearGradient id="${u}m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3d8da"/><stop offset=".55" stop-color="#959ea2"/><stop offset="1" stop-color="#5f686d"/></linearGradient>
<linearGradient id="${u}md" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#848d91"/><stop offset="1" stop-color="#4d555a"/></linearGradient>
<radialGradient id="${u}g"><stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" fill="url(#${u}w)"/>
<rect y="300" width="1200" height="340" fill="url(#${u}f)"/>
<rect y="34" width="1200" height="10" fill="#1a2023"/>
${[150,450,750,1050].map(x=>`<ellipse cx="${x}" cy="60" rx="140" ry="46" fill="url(#${u}g)"/><rect x="${x-40}" y="44" width="80" height="6" rx="2" fill="#e9e3cf"/>`).join('')}
${[[30,120,290,192],[360,96,340,216],[760,132,400,180]].map(([x,y,w,h])=>`
<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#4b565b"/><rect x="${x}" y="${y}" width="${w}" height="8" rx="4" fill="#5d696f"/>
<rect x="${x+18}" y="${y+28}" width="${w*0.55}" height="${h*0.5}" rx="4" fill="#182023"/><rect x="${x+18}" y="${y+28}" width="${w*0.55}" height="${h*0.5}" rx="4" fill="#6fb6c9" opacity=".08"/>
<rect x="${x+w*0.68}" y="${y+30}" width="${w*0.22}" height="${h*0.32}" rx="3" fill="#2b3337"/><rect x="${x+w*0.7}" y="${y+36}" width="${w*0.18}" height="${h*0.12}" rx="2" fill="#4aa3b8" opacity=".55"/>
<rect x="${x}" y="${y+h-14}" width="${w}" height="14" fill="#3a4448"/>`).join('')}
<rect y="330" width="1200" height="6" fill="#d8b02a" opacity=".85"/>
<rect y="604" width="1200" height="6" fill="#d8b02a" opacity=".85"/>
<path d="M0 420 H1200 M0 520 H1200" stroke="#000" stroke-opacity=".12"/>`}

function skid(x){return `<g><rect x="${x-78}" y="500" width="156" height="8" fill="#9a774d"/><path d="M${x-78} 504 H${x+78}" stroke="#7a5c3a" stroke-width="1"/>
${[-78,-8,62].map(d=>`<rect x="${x+d}" y="508" width="16" height="12" fill="#7a5c3a"/>`).join('')}<rect x="${x-78}" y="519" width="156" height="3" fill="#000" opacity=".25"/></g>`}
function ring(x,u){return `<g><ellipse cx="${x}" cy="497" rx="62" ry="14" fill="url(#${u}md)"/><rect x="${x-62}" y="450" width="124" height="47" fill="url(#${u}m)"/><ellipse cx="${x}" cy="450" rx="62" ry="14" fill="#c6ccce"/><ellipse cx="${x}" cy="450" rx="40" ry="8.5" fill="#1c2226"/></g>`}
function bracket(x,u){return `<g><polygon points="${x-20},460 ${x+60},460 ${x+78},448 ${x-2},448" fill="#c8ced0"/><polygon points="${x-60},420 ${x-20},420 ${x-2},408 ${x-42},408" fill="#c8ced0"/>
<polygon points="${x+60},460 ${x+78},448 ${x+78},488 ${x+60},500" fill="#646d71"/><polygon points="${x-20},420 ${x-2},408 ${x-2},448 ${x-20},460" fill="#646d71"/>
<polygon points="${x-60},500 ${x-60},420 ${x-20},420 ${x-20},460 ${x+60},460 ${x+60},500" fill="url(#${u}m)"/><circle cx="${x-40}" cy="446" r="9" fill="#1c2226"/></g>`}
function bars(x,u){let s='';for(let r=0;r<3;r++){for(let i=0;i<3-r;i++){const cx=x-48+i*22+r*11,cy=488-r*19;s+=`<rect x="${cx}" y="${cy-9}" width="86" height="18" fill="url(#${u}m)"/><circle cx="${cx}" cy="${cy}" r="9.5" fill="#d6dbdd" stroke="#6c757a"/>`}}return `<g>${s}<rect x="${x-10}" y="440" width="7" height="62" fill="#2f5d8a" opacity=".9"/></g>`}
function housing(x,u,tag=true){return `<g><polygon points="${x-55},425 ${x+55},425 ${x+72},413 ${x-38},413" fill="#c8ced0"/><polygon points="${x+55},425 ${x+72},413 ${x+72},488 ${x+55},500" fill="#646d71"/>
<rect x="${x-55}" y="425" width="110" height="75" fill="url(#${u}m)"/><circle cx="${x}" cy="462" r="23" fill="#1c2226"/><circle cx="${x}" cy="462" r="23" fill="none" stroke="#e6e9ea" stroke-opacity=".5" stroke-width="2"/>
${tag?`<path d="M${x+64} 418 L${x+70} 436" stroke="#c9c9c9" stroke-width="1.4"/><rect x="${x+62}" y="434" width="15" height="22" rx="2" fill="#c8372a" transform="rotate(8 ${x+70} 445)"/>`:''}</g>`}
function shaft(x,u){return `<g><rect x="${x-50}" y="484" width="18" height="16" fill="#3a4246"/><rect x="${x+32}" y="484" width="18" height="16" fill="#3a4246"/>
<rect x="${x-72}" y="460" width="144" height="28" fill="url(#${u}m)"/><ellipse cx="${x+72}" cy="474" rx="6" ry="14" fill="#a9b1b4"/><rect x="${x-72}" y="466" width="144" height="4" fill="#fff" opacity=".25"/></g>`}

function person(x,fy,s,o){const sk=o.skin||'#c99a78';return `<g transform="translate(${x},${fy}) scale(${s})">
<ellipse cx="0" cy="0" rx="34" ry="5" fill="#000" opacity=".3"/>
<path d="M-24 -112 L-27 -8 L-7 -8 L-2 -96 L2 -96 L7 -8 L27 -8 L24 -112 Z" fill="${o.pants}"/>
<rect x="-31" y="-11" width="25" height="11" rx="4" fill="#1a1d20"/><rect x="6" y="-11" width="25" height="11" rx="4" fill="#1a1d20"/>
<path d="M-36 -196 L-46 -134 L-38 -128 L-28 -170 Z" fill="${o.shirt}"/><path d="M36 -196 L46 -134 L38 -128 L28 -170 Z" fill="${o.shirt}"/>
<circle cx="-42" cy="-126" r="6" fill="${sk}"/><circle cx="42" cy="-126" r="6" fill="${sk}"/>
<rect x="-8" y="-224" width="16" height="14" fill="${sk}"/>
<path d="M-36 -198 Q-36 -214 -20 -216 L20 -216 Q36 -214 36 -198 L30 -108 L-30 -108 Z" fill="${o.shirt}"/>
<path d="M-10 -216 L0 -200 L10 -216" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="2"/>
${o.badge?`<rect x="12" y="-190" width="14" height="9" rx="1.5" fill="#e8e2d0"/>`:''}
<circle cx="0" cy="-244" r="23" fill="${sk}"/>
<path d="M-24 -246 Q-24 -272 0 -272 Q24 -272 24 -246 Q20 -258 0 -260 Q-20 -258 -24 -246 Z" fill="${o.hair}"/>
${o.bun?`<circle cx="0" cy="-274" r="10" fill="${o.hair}"/>`:''}
<rect x="-19" y="-250" width="38" height="10" rx="4" fill="#bfe4f0" fill-opacity=".75" stroke="#1d2427" stroke-width="1.5"/>
${o.clip?`<g transform="rotate(-6 34 -150)"><rect x="22" y="-176" width="34" height="46" rx="2" fill="#7a5c3a"/><rect x="25" y="-172" width="28" height="39" fill="#f4f1e8"/><rect x="32" y="-179" width="14" height="6" rx="2" fill="#9aa3a7"/>
<path d="M28 -164 H50 M28 -158 H50 M28 -152 H44 M28 -146 H50" stroke="#8c949a" stroke-width="1.4"/></g>`:''}
</g>`}
const DANA={shirt:'#34506b',pants:'#2b2f36',hair:'#3a2a20',bun:true,clip:true,badge:true};
const SUP={shirt:'#5d676c',pants:'#2b2f36',hair:'#6b6158',skin:'#e0b796',badge:true};

/* Aisle: five parts in staging. Positions chosen so the activity is not in legend order. */
const AISLE=[{x:240,c:'yellow',p:'ring',n:'Machined ring'},{x:450,c:'green',p:'bracket',n:'Bracket'},{x:660,c:'white',p:'bars',n:'Bar stock'},{x:870,c:'red',p:'housing',n:'Housing'},{x:1070,c:'blue',p:'shaft',n:'Shaft'}];
function aisleSVG(u,opt={}){const parts={ring,bracket,bars,housing,shaft};
  return `<svg viewBox="0 0 1200 640" role="img" aria-label="A machining aisle with five parts on skids, each with a quality cone${opt.labels?', each labeled with its status':''}" ${opt.slice?'preserveAspectRatio="xMidYMid slice"':''}>${shopBg(u)}
${AISLE.map((a,i)=>`${skid(a.x)}${a.p==='housing'?housing(a.x,u,true):parts[a.p](a.x,u)}${coneG(a.c,a.x+68,524,.82)}
${opt.num?`<text x="${a.x}" y="560" text-anchor="middle" font-family="${MONO}" font-size="15" fill="#a3adb1">PART ${i+1}</text>`:''}
${opt.labels?`<g><rect x="${a.x-92}" y="368" width="184" height="32" rx="16" fill="#121618" fill-opacity=".92" stroke="${CONES[a.c].fill}" stroke-width="2"/><circle cx="${a.x-74}" cy="384" r="7" fill="${CONES[a.c].fill}" stroke="#fff" stroke-opacity=".4"/>
<text x="${a.x+8}" y="389" text-anchor="middle" font-family="${SANS}" font-size="13.5" font-weight="600" fill="#ebe6dc">${CONES[a.c].label}</text><path d="M${a.x} 400 V420" stroke="${CONES[a.c].fill}" stroke-width="2"/></g>`:''}`).join('')}
${opt.dana===false?'':person(96,632,1.02,DANA)}</svg>`}

/* COD-03 scene: held part with red cone and Hold Tag, Dana and supervisor, tag close-up */
function holdTagG(tx,ty,s){return `<g transform="translate(${tx},${ty}) scale(${s})">
<path d="M30 0 H250 L280 30 V470 H0 V30 Z" fill="#c8372a" stroke="#8d2117" stroke-width="2"/>
<circle cx="140" cy="30" r="12" fill="#f3ece0" stroke="#8d2117" stroke-width="3"/>
<text x="140" y="98" text-anchor="middle" font-family="${SANS}" font-size="50" font-weight="700" fill="#fff" letter-spacing="6">HOLD</text>
<rect x="16" y="118" width="248" height="338" rx="3" fill="#fbf8f2"/>
<g font-family="${MONO}" font-size="11" fill="#3a3a3a" letter-spacing=".5">
<text x="26" y="150">JOB #</text><text x="160" y="150">DATE</text>
<text x="26" y="192">PART NO.</text><text x="26" y="234">PART NAME</text><text x="26" y="276">REASON</text>
<text x="26" y="360">INSPECTOR</text><text x="26" y="402">QUANTITY</text><text x="140" y="402">NMR #</text></g>
<g stroke="#9a9a9a" stroke-width="1"><path d="M66 153 H152 M196 153 H254 M92 195 H254 M106 237 H254 M84 279 H254 M26 318 H254 M106 363 H254 M98 405 H132 M184 405 H254"/></g>
<g font-family="${HAND}" font-size="16" fill="#1d3c8f">
<text x="68" y="149">71245-0010</text><text x="198" y="149">11/12/26</text><text x="96" y="191">TS-4417 Rev C</text><text x="108" y="233">Support bracket</text>
<text x="86" y="275">Bore 2.5032</text><text x="30" y="314">req. 2.500 +.002/-.000</text><text x="110" y="359">QA stamp 07</text><text x="104" y="401">1</text><text x="188" y="401">26-0418</text></g>
<text x="140" y="440" text-anchor="middle" font-family="${MONO}" font-size="12" fill="#c8372a" letter-spacing="2" font-weight="600">TRAINING SAMPLE</text></g>`}
function heldSceneSVG(u){return `<svg viewBox="0 0 1200 640" role="img" aria-label="A housing on a skid with a red cone and a Hold Tag. Dana and her supervisor look at it. A close-up shows the Hold Tag fields.">${shopBg(u)}
<g transform="translate(-320,-173) scale(1.5)">${skid(560)}${housing(560,u,false)}</g>
<path d="M622 462 L636 492" stroke="#c9c9c9" stroke-width="2"/><rect x="624" y="490" width="26" height="38" rx="3" fill="#c8372a" stroke="#8d2117" transform="rotate(8 637 509)"/>
${coneG('red',372,622,1.35)}
${person(112,632,1.0,DANA)}${person(240,636,1.06,{...SUP,clip:false})}
<path d="M668 500 C 740 470, 800 400, 868 350" fill="none" stroke="#d29a2e" stroke-width="2.5" stroke-dasharray="7 6"/>
<circle cx="638" cy="510" r="30" fill="none" stroke="#d29a2e" stroke-width="2.5"/>
<rect x="842" y="70" width="340" height="560" rx="14" fill="#121618" fill-opacity=".9" stroke="#3a454a"/>
${holdTagG(872,142,1.0)}
<text x="1012" y="102" text-anchor="middle" font-family="${MONO}" font-size="14" fill="#d29a2e" letter-spacing="2">HOLD TAG CLOSE-UP</text></svg>`}

/* First Article tag, front and back */

 `${eyebrow(this)}<h2>${this.title}</h2><div class="onscreen"><p>Every cutting tool you load has two parts: the <strong>holder</strong> and the <strong>cutter</strong>.</p><ul>
 <li><strong>Holder:</strong> fits the spindle taper (40 or 50 taper at GTC) and grips the cutter</li><li><strong>Solid tool:</strong> the cutter is one piece (most end mills, drills, taps, reamers)</li>
 <li><strong>Insert tool:</strong> a steel body holds small replaceable inserts that do the cutting (face mills, insert mills, insert drills, most turning tools)</li><li><strong>Nose or corner radius:</strong> the rounded tip of the cutting edge; it shapes the corner and the surface finish</li></ul></div>
 <div class="warnbox">Handle tools by the holder, never by the cutting edges.</div>
 ${narr('When an insert wears, you change the insert, not the whole tool. When a solid tool wears, the whole cutter goes back to the crib. Either way, the edge is sharp: carry it by the holder.')}`)},

{id:'CUT-07',mod:'Module C: From crib to spindle',time:'2 min',obj:'O5',title:'Check it before it goes in',render(){const n=Object.keys(S.found7).length;

 return split(`<div class="panel"><div class="steps-lbl">1 · Which chips mean the cut is right?</div><div class="chips">${CHIPS.map(([k,n],i)=>`<button class="chipb ${c===i?(k==='coil'?'good':'bad'):''} ${c!=null&&CHIPS[c][0]==='coil'&&k==='coil'?'good':''}" data-i="${i}" ${c!=null&&CHIPS[c][0]==='coil'?'disabled':''}>${chipSVG(k)}<span>${'ABCD'[i]}${c!=null&&(c===i||CHIPS[c][0]==='coil')?' · '+n:''}</span></button>`).join('')}</div>
 <div class="fb ${c!=null&&CHIPS[c][0]==='coil'?'good':c!=null?'bad':''}">${c==null?'':CHIPS[c][0]==='coil'?'Right. Chips that coil like a spring and clear easily: the cut is right.':CHIPS[c][0]==='blue'?'Blue chips mean heat. Something has changed. Look again.':'That chip says something has changed. Look again.'}</div></div>
 <div class="panel ${c!=null&&CHIPS[c][0]==='coil'?'':'locked'}"><div class="steps-lbl">2 · Listen · which one means stop?</div><div class="actions">${['steady','chatter'].map((k,i)=>`<button class="btn ghost" data-play="${k}">▶ Play clip ${i+1}</button>`).join('')}</div>

 `${eyebrow(this)}<h2>${this.title}</h2><div class="onscreen"><p><strong>GTC standard:</strong> monitor changes in chip size, surface finish, tool breakage and worn tooling (GTC-PD-008, PD-181).</p><ul>

function toolListHTML(){return `<div class="toollist"><div class="tlh"><b>TOOL LIST</b><span>DNC 52310-01 · W/C 204 · OPER 30 · TRAINING SAMPLE</span></div><table>${TOOLLIST.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>W/C ${r[2]}</td></tr>`).join('')}</table></div>`}

/* ---------- engine ---------- */
function notesHTML(sc){const n=NOTES[sc.id];if(!n)return '';const pill={built:['p-built','Built'],stand:['p-stand','Stand-in'],need:['p-need','Asset needed']};
 return `<section class="rev" aria-label="Reviewer notes"><div class="rev-head"><h3>Reviewer notes · <span class="id">${sc.id}</span></h3>
<label class="jump">Jump to <select id="jumpsel">${SCREENS.map((s,k)=>`<option value="${k}" ${k===S.i?'selected':''}>${s.id==='cover'?'Cover':s.id+' '+s.title}</option>`).join('')}</select></label></div>
<div class="rev-grid"><div><b class="k">Screen</b><span class="id">${sc.id}</span></div><div><b class="k">Module</b><span>${sc.mod}</span></div><div><b class="k">Time</b><span>${sc.time||'20 min total'}</span></div><div><b class="k">Objective</b><span>${sc.obj||'O1 to O6'}</span></div></div>
<div class="rev-long"><div><b class="k">Visual brief (storyboard)</b><span>${n.visual}</span></div><div><b class="k">Developer notes and sources</b><span>${n.dev}</span></div></div>
${n.assets.length?`<div><b class="k">Graphics on this screen</b><ul class="assets">${n.assets.map(([a,s])=>`<li><span class="pill ${pill[s][0]}">${pill[s][1]}</span>${a}</li>`).join('')}</ul></div>`:''}
${n.flags.length?`<div class="flags"><b class="k">Flagged for review</b>${n.flags.map(f=>`<div class="flag ${f.lvl}"><b>${f.t}</b>${f.b}</div>`).join('')}</div>`:'<div class="hint">No open questions on this screen.</div>'}
<div class="legendflags"><span>Red: high priority</span><span>Amber: medium</span><span>Gray: low</span><span>Blue: build note from the developer</span></div></section>`}
function navHTML(sc){if(sc.id==='cover')return '';const ok=S.done[sc.id]||sc.auto;
 return `<div class="navbar"><button class="btn ghost" id="back">Back</button><div class="r">${ok||sc.last?'':'<span class="hint" id="lockhint">Finish the activity to continue.</span>'}${sc.last?'':`<button class="btn" id="next" ${ok||S.rev?'':'disabled'}>${S.rev&&!ok?'Skip (reviewer)':'Continue'}</button>`}</div></div>`}
function updateTrack(){const t=$('#track');t.innerHTML=SCREENS.map((s,k)=>`<button class="${k===S.i?'now':(S.done[s.id]||k<S.i)?'done':''}" data-k="${k}" aria-label="${s.id}" ${S.rev?'':'tabindex="-1"'}></button>`).join('');
 $$('#track button').forEach(b=>b.onclick=()=>{if(S.rev)go(+b.dataset.k)});const sc=SCREENS[S.i];$('#tlabel').textContent=sc.id==='cover'?'Start':`${sc.id} · ${S.i} of ${SCREENS.length-1}`}

 if(sc.mount)sc.mount();const b=$('#back');if(b)b.onclick=()=>go(S.i-1);const n=$('#next');if(n)n.onclick=()=>go(S.i+1);const j=$('#jumpsel');if(j)j.onchange=()=>go(+j.value);updateTrack();if(top)window.scrollTo({top:0})}
function go(k){S.i=Math.max(0,Math.min(SCREENS.length-1,k));render(true)}
$('#revt').onclick=()=>{S.rev=!S.rev;$('#revt').setAttribute('aria-pressed',S.rev);document.body.classList.toggle('revmode',S.rev);rerender()};
reset();

render(true);
